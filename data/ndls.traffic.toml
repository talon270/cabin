# NDLS traffic profile for cabin, read by the game's `Schedule` (slice B7).
#
# Every value is `{ v = ..., src = "<row ids>", tag = "..." }`. `src` names rows
# in research/traffic-volume.md (V-), research/traffic-pool.md (P-) and
# research/signalling-search.md (S-); an empty `src` means no source was found.
# `tag` is one of: primary, secondary, derived, assumed, unconfirmed. A test in
# cabin-osm fails when a value lacks either key, so a number cannot enter this
# file without saying where it came from or that it is a guess.
#
# Read this as pace, never as a count: the only per-day source is one paper's
# 2016 survey of NDLS's berthing chart (V-01, V-02), and the game must print its
# traffic as "about". One knob scales all of it.
#
# Written 2026-11-15 from the ledgers; the pool rows are copied from P-001..P-139.

[meta]
written = { v = "2026-11-15", src = "", tag = "derived" }


[volume]
# Busy day, 2016 (87 originating, 87 terminating, 103 through; the paper's parts sum to 277, the hourly chart to 275).
trains_per_day_busy = { v = 275, src = "V-02, V-03, V-12", tag = "assumed" }
# Older figure, no year; used as the quiet-day scale only.
trains_per_day_quiet = { v = 245, src = "V-04", tag = "assumed" }
# Trains per hour, hours 0 to 23, sum 275. Labels read from a chart image. The datameet 2016 count peaks at 13:00 instead (V-19).
hourly_weights = { v = [3, 2, 0, 2, 5, 9, 20, 16, 14, 22, 19, 10, 13, 14, 9, 7, 14, 21, 18, 12, 10, 12, 10, 13], src = "V-12", tag = "secondary" }
# Arrivals from the north side (Sadar Bazar), the rest from the south and east (Shivaji Bridge). One 2016 timetable counted as daily.
north_share = { v = 0.333, src = "V-22, V-23, V-24", tag = "assumed" }

[mix]  # share of trains by class; the three sum to 1.0
emu_local = { v = 0.28, src = "V-27", tag = "assumed" }
# Superfast, Mail, Express, Sampark Kranti, Garib Rath.
express = { v = 0.41, src = "V-27", tag = "assumed" }
# Rajdhani, Shatabdi, Duronto. Reading the leftover 31% as premium is a construction; datameet counts 28.8% for the same three.
premium = { v = 0.31, src = "V-27, V-28, V-29", tag = "assumed" }
# Split of the premium 31% in the 32:25:10 ratio of V-27 to V-29.
rajdhani = { v = 0.148, src = "V-27, V-28, V-29", tag = "assumed" }
shatabdi = { v = 0.116, src = "V-27, V-28, V-29", tag = "assumed" }
duronto = { v = 0.046, src = "V-27, V-28, V-29", tag = "assumed" }
# Zero until a current source is found; take its share out of premium when added.
vande_bharat = { v = 0.0, src = "V-36", tag = "assumed" }

[dwell_s]  # [low, high] seconds at a platform
# n = 5 trains: thin.
through_express = { v = [900, 1500], src = "P-181", tag = "secondary" }
# n = 6, 2017-2021 records.
through_passenger = { v = [120, 600], src = "P-182", tag = "assumed" }
# n = 8, 2017-2021 records.
through_emu = { v = [120, 600], src = "P-183", tag = "assumed" }
# No source gives platform dwell for a terminating train; the sourced figures are rake gaps (P-197, P-186) that bound the rake, not the platform.
terminating = { v = [600, 1200], src = "", tag = "assumed" }

[length_m]  # rake length, excluding the locomotive
# 24 m a car; the 16-car count is primary (PIB).
vande_bharat_16 = { v = 384, src = "P-158, P-159, P-160", tag = "secondary" }
vande_bharat_20 = { v = 480, src = "P-158, P-160", tag = "secondary" }
# 22 LHB vehicles at 24.0 m.
rajdhani = { v = 528, src = "P-156, P-161, P-162, P-163", tag = "assumed" }
# 16 coaches; the pool spans 11 to 18.
shatabdi = { v = 384, src = "P-156, P-164", tag = "assumed" }
# 19 vehicles, median of 18 to 21.
duronto = { v = 456, src = "P-156, P-166", tag = "assumed" }
# Midpoint of 490 to 530 (22 vehicles, ICF 22.3 m to LHB 24.0 m).
superfast = { v = 510, src = "P-171, P-172, P-176", tag = "assumed" }
mail_express = { v = 510, src = "P-171, P-172, P-176", tag = "assumed" }
humsafar = { v = 480, src = "P-168", tag = "assumed" }
garib_rath = { v = 432, src = "P-170", tag = "assumed" }
# The count conflicts with Wikipedia's other Tejas.
tejas = { v = 336, src = "P-169", tag = "assumed" }
jan_shatabdi = { v = 336, src = "P-165", tag = "assumed" }
# 12 coaches (secondary) at an assumed 22 m a car (no source).
emu = { v = 264, src = "P-175, P-179", tag = "assumed" }
# 8 to 9 coaches at an assumed 22 m, midpoint.
memu = { v = 187, src = "P-174, P-179", tag = "assumed" }
# No source: read as a MEMU-sized rake.
passenger = { v = 187, src = "", tag = "assumed" }
# WAP-7 and WAG-9; WAP-5 is 18.2 m. Add to every loco-hauled type; which loco hauls which train is unsourced (P-208).
loco = { v = 20.6, src = "P-205, P-206", tag = "secondary" }

[platforms]
# Platform 1 on the Paharganj side, 16 on the Ajmeri Gate side (S-02).
count = { v = 16, src = "S-01", tag = "secondary" }

# The draw pool: 139 real trains at NDLS. `pf` is a per-train platform from the
# source (P-201); no allotment source exists (P-204), so it is a weighted default.
# `src` is the P- row; `tag` is that row's tag. The 28 passenger and EMU/MEMU
# trains carry 2017-2021 records and are `unconfirmed`.

