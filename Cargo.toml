# cabin workspace. `sim` is pure Rust and testable headless; `web` is the thin
# browser shell compiled to wasm; `osm` is the yard extractor, run by hand.
[workspace]
resolver = "3"
members = ["crates/sim", "crates/web", "crates/osm"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[profile.release]
# Speed over size, as in twr: the file is opened locally.
opt-level = 3
lto = true
codegen-units = 1
